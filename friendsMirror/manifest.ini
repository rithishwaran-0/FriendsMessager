name = friendsMirror
summary = "Friends Mirror"
description = """A private chat for NVDA users but without calls. Chat one to one or in groups with friends by user name. Reply, forward, edit, delete for everyone, star and react to messages; see sent, delivered and read marks, online status and typing; send files, voice messages, polls and contacts; post 24 hour status updates; use broadcast lists, disappearing messages, mute, pin, archive, search and block. All messages and files are end-to-end encrypted. In New chat, search for users, pick one from the list and send a message request; once they accept, chat as usual. Open it with NVDA+Alt+C or from the NVDA menu, Tools, Friends Mirror. New message notifications with sender name and a message tone. AI tools with 26 AI providers (set the provider, model and API key in NVDA settings, Friends Mirror, with model list and connection test) 30 soft sound effects and 40 notification sounds to choose from: suggest replies, rewrite, translate, summarize chats, describe pictures and write down voice messages. AI voice messages with Google text to speech, optional soft background music, hidden password boxes that say star. Also scheduled messages, reminders, quick replies, auto reply, quiet hours, keyword alerts, app lock, backup and more."""
